org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kompilasi inkremental Kotlin gagal di Windows bila proyek dan Pub cache
# berada di drive berbeda (proyek di D:, Pub cache di C:). Kompilernya
# mencoba menghitung path relatif antar-drive dan berhenti dengan
# "this and base files have different roots". Mematikannya hanya membuat
# build plugin sedikit lebih lambat; hot reload Dart tidak terpengaruh.
kotlin.incremental=false
