name: wangsa-mobile-platform
label: Wangsa Mobile
kind: platform
version: 1.0.0
description: >
  Exposes Wangsa to the Wangsa Flutter mobile app over a small REST API
  (2 routes, not JSON-RPC/SSE): GET /api/v1/agents/{agentId} returns a static
  identity envelope, POST /api/v1/agents/{agentId}/messages routes a message
  into the agent's live gateway session (same MessageEvent path as every
  other inbound platform) and returns the reply synchronously.

  Security is on by default: no bearer token configured => localhost-only
  bind. When a token is configured, it is required on the POST /messages
  route (the GET identity route stays open — no sensitive data). A small
  fixed-window rate limiter protects the POST route per caller IP.

  Pure stdlib transport (http.server) — no extra dependencies required.
author: Nous Research
requires_env: []
optional_env:
  - name: WANGSA_MOBILE_BEARER_TOKEN
    description: "Bearer token required on POST /api/v1/agents/{agentId}/messages. With no token => bind to 127.0.0.1 only (no remote access)."
    prompt: "Wangsa Mobile bearer token (or empty for localhost-only)"
    password: true
  - name: WANGSA_MOBILE_PORT
    description: "Inbound Wangsa Mobile server port (default 9901)."
    prompt: "Wangsa Mobile port (default 9901)"
    password: false
  - name: WANGSA_MOBILE_AGENT_NAME
    description: "Agent name returned by GET /api/v1/agents/{agentId} (default: 'Wangsa')."
    prompt: "Wangsa Mobile agent name"
    password: false
  - name: WANGSA_MOBILE_AGENT_PURPOSE
    description: "Agent purpose/description returned by GET /api/v1/agents/{agentId}."
    prompt: "Wangsa Mobile agent purpose"
    password: false
